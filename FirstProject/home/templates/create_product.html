<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin-left: 200px;
  background: #5d9ab2 url("img_tree.png") no-repeat top left;
}

.center_div {
  border: 1px solid gray;
  margin-left: auto;
  margin-right: auto;
  width: 90%;
  background-color: #d0f0f6;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>

<div class="center_div">
  <h2>{{title}}</h2>
  <form name="frmn" action="/product/save" method="post" enctype='multipart/form-data'>
    {% csrf_token %}
    <p>Product Name :<input type="text" name="product_name"/></p>
    <p><input type="file" name="upload_file"/></p>
    <p><input type="submit" value="Add Product"/></p>
  </form>
</div>

</body>
</html>
