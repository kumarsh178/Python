<!DOCTYPE html>
<html>
<head>
<title>Hospital Chatbot</title>

<style>
body{
font-family: Arial;
margin:40px;
}

#chatbox{
border:1px solid #ccc;
height:400px;
overflow:auto;
padding:10px;
}

.message{
margin:10px;
}

.user{
color:blue;
}

.bot{
color:green;
}

</style>
</head>

<body>

<h2>Hospital AI Chatbot</h2>

<div id="chatbox"></div>

<input type="text" id="msg" placeholder="Ask about patients">
<button onclick="send()">Send</button>

<script>

function send(){

let message = document.getElementById("msg").value;

document.getElementById("chatbox").innerHTML +=
"<div class='message user'>You: "+message+"</div>";

fetch("/chat/api/?message="+message)
.then(res=>res.json())
.then(data=>{

document.getElementById("chatbox").innerHTML +=
"<div class='message bot'>Bot: "+JSON.stringify(data.reply)+"</div>";

})

}

</script>

</body>
</html>
